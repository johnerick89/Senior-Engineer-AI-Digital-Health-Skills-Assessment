services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "6100:6100"
    volumes:
      - ./backend:/usr/src/LMH
      - ./rag_core:/rag_core
    env_file:
      - ./rag_core/.env
    environment:
      - PORT=6100
      - WATCHFILES_FORCE_POLLING=true
      - DATABASE_URL=postgresql://postgres:postgres@relational_db:5432/postgres
      - PYTHONPATH=/usr/src/LMH:/rag_core
    depends_on:
      - relational_db
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "6100",
        "--reload",
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:6100
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]
    depends_on:
      - backend

  chainlit:
    build:
      context: ./chainlit_app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./chainlit_app:/chainlit_app
    environment:
      - WATCHFILES_FORCE_POLLING=true
    command:
      [
        "python",
        "-m",
        "chainlit",
        "run",
        "main.py",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "-w",
      ]

  rag_core:
    build:
      context: ./rag_core
      dockerfile: Dockerfile
    volumes:
      - ./rag_core:/rag_core
    env_file:
      - ./rag_core/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@relational_db:5432/postgres
      - TEST_DATABASE_URL=postgresql://postgres:postgres@relational_db:5432/postgres
    depends_on:
      - relational_db
    profiles:
      - tools

  relational_db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - db_volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_volume:
  frontend_node_modules:
  frontend_next_cache:
